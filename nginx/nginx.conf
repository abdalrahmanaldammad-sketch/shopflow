log_format upstream_log '$remote_addr - [$time_local] "$request" $status '
                        'upstream: $upstream_addr response_time: ${upstream_response_time}s';

# Req 5 - Load Distribution: Docker DNS round-robin across scaled app instances
# Using variable-based proxy_pass forces nginx to re-resolve DNS per request,
# allowing Docker's internal DNS to rotate between container IPs.

server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver — re-resolve every 5s
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log /var/log/nginx/access.log upstream_log;

    # Block actuator endpoints from external access — Prometheus reaches app directly on the Docker network
    location /actuator {
        deny all;
        return 403;
    }

    location / {
        # Variable forces DNS re-resolution on every request (critical for round-robin)
        set $backend http://app:8080;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Pass original client info to backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}