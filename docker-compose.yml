



services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "6000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # Redis (JWT blacklisting + token store)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # Spring Boot Application
  # Built via: ./mvnw jib:dockerBuild
  # Scaled to 2 instances: docker compose up --scale app=2
  # No container_name — required for scaling
  # No host ports — nginx handles external access
  # ─────────────────────────────────────────────
  app:
    image: shopflow:latest
    restart: unless-stopped
    environment:
      # Req 9/10 — set SPRING_PROFILES_ACTIVE=loadtest to seed demo data + open order endpoints.
      # Set SPRING_CACHE_TYPE=none for the "before" (no-cache) benchmark run.
      # LOADTEST_SEED_PRODUCTS sizes the seeded catalog (small=contention demo, large=caching demo).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      LOADTEST_SEED_PRODUCTS: ${LOADTEST_SEED_PRODUCTS:-5000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-aboodisthebestintheworldwhatareyougonnadoaboodisthebestintheworldwhatareyougonnado}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # Nginx Load Balancer
  # Req 5 — Load Distribution: round-robin via Docker DNS
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shopflow-nginx
    restart: unless-stopped
    ports:
      # Host port 80 is often taken by a system web server; map to 8080 on the host instead.
      # JMeter is unaffected — it reaches nginx over the internal network as nginx:80.
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # Prometheus — metrics collection
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: shopflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - app
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # Grafana — metrics visualization
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: shopflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shopflow-network

  # ─────────────────────────────────────────────
  # JMeter — stress test runner (Req 9 / Req 10)
  # Gated behind the 'tools' compose profile so it does NOT start on a normal
  # `docker compose up`. Run it on demand with:
  #   docker compose run --rm jmeter -n -t /test/shopflow.jmx \
  #     -Jhost=nginx -Jport=80 -Jduration=120 \
  #     -l /test/results/after.jtl -e -o /test/results/after
  # Output lands in ./loadtest/results/ on the host.
  # ─────────────────────────────────────────────
  jmeter:
    image: alpine/jmeter:latest
    container_name: shopflow-jmeter
    profiles: ["tools"]
    volumes:
      - ./loadtest:/test
    networks:
      - shopflow-network

# ─────────────────────────────────────────────
# Named volumes — data survives container restarts
# ─────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

# ─────────────────────────────────────────────
# Isolated network — containers talk by service name
# ─────────────────────────────────────────────
networks:
  shopflow-network:
    driver: bridge